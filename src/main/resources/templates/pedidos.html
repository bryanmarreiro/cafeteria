<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQA Café | Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                ☕ SQA Café
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html">Cardápio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="administrativo.html">Sobre nós</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Fazer login</a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main class="container py-5 mt-5">

        <div class="text-center mb-5">
            <h1>☕ Faça seu pedido</h1>
            <p class="lead">
                Escolha seus produtos favoritos e aproveite o SQA Café.
            </p>
        </div>

        <div class="row g-4">

            <div class="col-lg-7">

                <div class="card shadow-sm p-4">

                    <h3 class="mb-4">Seu pedido</h3>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Produto escolhido
                        </label>

                        <select id="produto" class="form-select">

                            <option value="">Selecione um produto</option>

                            <option value="Cappuccino cremoso">
                                Cappuccino cremoso
                            </option>

                            <option value="Café clássico">
                                Café clássico
                            </option>

                            <option value="Cold Brew">
                                Cold Brew
                            </option>

                            <option value="Mocha de chocolate">
                                Mocha de chocolate
                            </option>

                            <option value="Apple brouw">
                                Apple brouw
                            </option>

                            <option value="Bolo de chocolate">
                                Bolo de chocolate
                            </option>

                            <option value="Croissant">
                                Croissant
                            </option>

                            <option value="Salgado de frango">
                                Salgado de frango
                            </option>

                            <option value="Milkshake de chocolate">
                                Milkshake de chocolate
                            </option>

                        </select>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">
                                Quantidade
                            </label>

                            <input type="number" class="form-control" value="1" min="1">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label fw-bold">
                                Tipo do pedido
                            </label>

                            <select class="form-select">

                                <option selected>Escolha uma opção</option>
                                <option>Consumir no local</option>
                                <option>Retirar na cafeteria</option>
                                <option>Entrega</option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Observações
                        </label>

                        <textarea class="form-control" rows="4"
                            placeholder="Ex: pouco açúcar, sem gelo, etc."></textarea>

                    </div>

                    <button class="btn btn-dark w-100">
                        Fazer pedido
                    </button>

                </div>

            </div>

            <div class="col-lg-5">

                <div class="card shadow-sm p-4">

                    <h3>Resumo do pedido</h3>

                    <p class="mt-3">
                        Produto:
                        <strong id="produtoResumo">Nenhum produto selecionado</strong>
                    </p>

                    <p>
                        Quantidade:
                        <strong>1</strong>
                    </p>

                </div>

            </div>

        </div>

    </main>

   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
