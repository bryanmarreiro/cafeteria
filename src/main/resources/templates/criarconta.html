```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SQA Café | Criar Conta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">☕ SQA Café</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre-nos.html">Sobre Nós</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="produtos.html">Cardápio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedidos.html">Pedidos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Entrar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5" style="margin-top: 80px;">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h1 class="h2 fw-bold">Crie sua conta</h1>
                            <p>Faça parte da família SQA Café!</p>
                        </div>

                        <form id="formCriarConta">

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome completo
                                </label>
                                <input type="text" class="form-control" id="nome" name="nome"
                                    placeholder="Digite seu nome completo" autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    E-mail
                                </label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="seuemail@exemplo.com" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="telefone" class="form-label">
                                    Telefone
                                </label>
                                <input type="tel" class="form-control" id="telefone" name="telefone"
                                    placeholder="(11) 99999-9999" autocomplete="tel" required>
                            </div>

                            <div class="mb-3">
                                <label for="senha" class="form-label">
                                    Senha
                                </label>
                                <input type="password" class="form-control" id="senha" name="senha"
                                    placeholder="Crie uma senha" autocomplete="new-password" minlength="8" required>
                                <small class="form-text">
                                    A senha deve ter pelo menos 8 caracteres.
                                </small>
                            </div>

                            <div class="mb-3">
                                <label for="confirmarSenha" class="form-label">
                                    Confirmar senha
                                </label>
                                <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha"
                                    placeholder="Digite a senha novamente" autocomplete="new-password" minlength="8"
                                    required>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termos" required>
                                <label class="form-check-label" for="termos">
                                    Aceito os termos de uso e a política de
                                    privacidade.
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Criar minha conta
                            </button>

                            <div id="mensagem" class="mt-3" role="status" aria-live="polite"></div>

                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Já tem uma conta?
                                <a href="login.html">Faça login</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="text-center py-4">
        <p class="mb-0">
            &copy; 2026 SQA Café. Todos os direitos reservados.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const formulario = document.getElementById("formCriarConta");
        const mensagem = document.getElementById("mensagem");

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmarSenha =
                document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                mensagem.className = "mt-3 text-danger";
                mensagem.textContent = "As senhas não são iguais.";
                return;
            }

            mensagem.className = "mt-3 text-success";
            mensagem.textContent =
                "Formulário validado! Para criar sua conta de verdade, é necessário conectar um sistema de cadastro.";

        });
    </script>

</body>

</html>
